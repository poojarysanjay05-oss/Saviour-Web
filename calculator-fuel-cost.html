<script>

function inr(n) {
  n = Math.round(n || 0);
  const neg = n < 0; n = Math.abs(n);
  const s = n.toString(), last3 = s.slice(-3), rest = s.slice(0, -3);
  const withCommas = rest ? rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3 : last3;
  return (neg ? '-' : '') + '\u20B9' + withCommas;
}
class Component extends DCLogic {
  state = { distance: 20, mileage: 15, price: 100, days: 22 };
  renderVals() {
    const { distance, mileage, price, days } = this.state;
    const monthly = mileage > 0 ? (distance / mileage) * price * days : 0;
    return {
      distance, mileage, price, days,
      onDistance: (e) => this.setState({ distance: Number(e.target.value) }),
      onMileage: (e) => this.setState({ mileage: Number(e.target.value) }),
      onPrice: (e) => this.setState({ price: Number(e.target.value) }),
      onDays: (e) => this.setState({ days: Number(e.target.value) }),
      monthlyFmt: inr(monthly),
      yearlyFmt: inr(monthly * 12),
      faqs: [
        { q: 'How do I calculate my monthly fuel cost?', a: "Divide your daily commute distance by your vehicle's mileage to get litres used per day, multiply by fuel price, then multiply by the number of days you drive per month." },
        { q: "How can I improve my vehicle's mileage?", a: 'Maintain correct tyre pressure, service your vehicle regularly, avoid harsh acceleration and braking, and remove excess weight to improve fuel efficiency.' },
        { q: 'Is carpooling worth it for fuel savings?', a: 'Yes, carpooling can cut your personal fuel cost significantly when split with even one other commuter on a similar route.' },
        { q: 'Should I switch to an electric or hybrid vehicle to save on fuel?', a: 'If you drive long distances regularly, an electric or hybrid vehicle can substantially lower running costs over time, though the upfront cost is higher.' }
      ]
    };
  }
}
