<script>

function inr(n) {
  n = Math.round(n || 0);
  const neg = n < 0; n = Math.abs(n);
  const s = n.toString(), last3 = s.slice(-3), rest = s.slice(0, -3);
  const withCommas = rest ? rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3 : last3;
  return (neg ? '-' : '') + '\u20B9' + withCommas;
}
class Component extends DCLogic {
  state = { monthly: 15000, years: 25, rate: 10 };
  renderVals() {
    const { monthly, years, rate } = this.state;
    const r = rate / 12 / 100, n = years * 12;
    const corpus = r === 0 ? monthly * n : monthly * ((Math.pow(1 + r, n) - 1) / r) * (1 + r);
    const contributed = monthly * n;
    return {
      monthly, years, rate,
      onMonthly: (e) => this.setState({ monthly: Number(e.target.value) }),
      onYears: (e) => this.setState({ years: Number(e.target.value) }),
      onRate: (e) => this.setState({ rate: Number(e.target.value) }),
      corpusFmt: inr(corpus),
      contributedFmt: inr(contributed),
      growthFmt: inr(Math.max(0, corpus - contributed)),
      faqs: [
        { q: 'How much should I save for retirement?', a: 'A common rule of thumb is to aim for a corpus of 20-25 times your annual expenses at retirement, though the right number depends on your lifestyle and other income sources.' },
        { q: 'Why does starting early matter so much for retirement?', a: 'Starting early gives compounding more time to work, so even smaller monthly contributions early on can outgrow larger contributions started later.' },
        { q: 'What return rate should I assume for retirement planning?', a: "A conservative long-term equity-heavy portfolio has historically returned 10-12% annually in India before inflation, though it's safer to plan with a moderate assumption." },
        { q: 'Should I include EPF and NPS in my retirement corpus?', a: 'Yes, include employer and employee EPF contributions and any NPS savings as part of your total retirement corpus projection.' }
      ]
    };
  }
}

</script>
