<script>

function inr(n) {
  n = Math.round(n || 0);
  const neg = n < 0; n = Math.abs(n);
  const s = n.toString(), last3 = s.slice(-3), rest = s.slice(0, -3);
  const withCommas = rest ? rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3 : last3;
  return (neg ? '-' : '') + '\u20B9' + withCommas;
}
class Component extends DCLogic {
  state = { principal: 100000, rate: 8, years: 10 };
  renderVals() {
    const { principal, rate, years } = this.state;
    const simple = principal * rate * years / 100;
    const compound = principal * Math.pow(1 + rate / 100, years) - principal;
    const simpleBarPct = Math.min(100, Math.round((simple / compound) * 100));
    return {
      principal, rate, years,
      onPrincipal: (e) => this.setState({ principal: Number(e.target.value) }),
      onRate: (e) => this.setState({ rate: Number(e.target.value) }),
      onYears: (e) => this.setState({ years: Number(e.target.value) }),
      simpleFmt: inr(simple), simpleTotalFmt: inr(principal + simple),
      compoundFmt: inr(compound), compoundTotalFmt: inr(principal + compound),
      simpleBarPct,
      faqs: [
        { q: 'What is the difference between simple and compound interest?', a: 'Simple interest is calculated only on the original principal, while compound interest is calculated on the principal plus any interest already earned, so it grows faster over time.' },
        { q: 'Which grows money faster?', a: 'Compound interest grows money faster than simple interest over the same period, and the gap widens the longer the money is invested.' },
        { q: 'Do loans use simple or compound interest?', a: 'Most loans, including EMIs, use compound interest calculated monthly, which is why paying off a loan early can save meaningfully on total interest.' },
        { q: 'How often should compounding happen for best returns?', a: 'More frequent compounding (monthly or daily) yields slightly higher returns than annual compounding at the same stated rate.' }
      ]
    };
  }
}
