<script>

function inr(n) {
  n = Math.round(n || 0);
  const neg = n < 0; n = Math.abs(n);
  const s = n.toString(), last3 = s.slice(-3), rest = s.slice(0, -3);
  const withCommas = rest ? rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3 : last3;
  return (neg ? '-' : '') + '\u20B9' + withCommas;
}
class Component extends DCLogic {
  state = { costPerMeal: 350, mealsPerWeek: 6 };
  renderVals() {
    const { costPerMeal, mealsPerWeek } = this.state;
    const monthly = costPerMeal * mealsPerWeek * 4.33;
    const homeMonthly = monthly * 0.3;
    return {
      costPerMeal, mealsPerWeek,
      onCost: (e) => this.setState({ costPerMeal: Number(e.target.value) }),
      onMeals: (e) => this.setState({ mealsPerWeek: Number(e.target.value) }),
      monthlyFmt: inr(monthly),
      yearlyFmt: inr(monthly * 12),
      savingsFmt: inr(monthly - homeMonthly),
      faqs: [
        { q: 'How much does the average person spend eating out?', a: 'Spending on eating out varies widely, but even 3-4 meals a week at moderate prices can add up to several thousand rupees a month.' },
        { q: 'How much can I save by cooking at home?', a: 'Cooking at home typically costs a fraction of eating out for the same meal, so shifting even a few meals a week to home cooking can meaningfully cut monthly spending.' },
        { q: 'Should I cut out dining out completely?', a: 'Not necessarily \u2014 dining out has social value too. The goal is usually to be intentional about frequency rather than eliminating it entirely.' },
        { q: 'How do delivery fees affect dining out costs?', a: 'Delivery fees, platform fees and tips can add 15-25% on top of the food cost, making delivery meaningfully pricier than dining in or takeaway.' }
      ]
    };
  }
}
