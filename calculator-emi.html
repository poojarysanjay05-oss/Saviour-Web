<script>

function inr(n) {
  n = Math.round(n || 0);
  const neg = n < 0; n = Math.abs(n);
  const s = n.toString(), last3 = s.slice(-3), rest = s.slice(0, -3);
  const withCommas = rest ? rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3 : last3;
  return (neg ? '-' : '') + '\u20B9' + withCommas;
}
class Component extends DCLogic {
  state = { principal: 2000000, rate: 8.5, years: 20 };

  emi(p, annualRate, months) {
    const r = annualRate / 12 / 100;
    if (r === 0) return p / months;
    return p * r * Math.pow(1 + r, months) / (Math.pow(1 + r, months) - 1);
  }

  renderVals() {
    const { principal, rate, years } = this.state;
    const months = years * 12;
    const pay = this.emi(principal, rate, months);
    const totalPayment = pay * months;
    const totalInterest = totalPayment - principal;
    const pPct = Math.round((principal / totalPayment) * 100);
    const iPct = 100 - pPct;
    const angle = pPct * 3.6;
    return {
      principal, rate, years,
      principalFmt: inr(principal),
      emiFmt: inr(pay),
      totalInterestFmt: inr(totalInterest),
      totalPaymentFmt: inr(totalPayment),
      principalPct: pPct,
      interestPct: iPct,
      pieGradient: 'conic-gradient(#E6C763 0deg ' + angle + 'deg, #3A3A3D ' + angle + 'deg 360deg)',
      onPrincipal: (e) => this.setState({ principal: Number(e.target.value) }),
      onRate: (e) => this.setState({ rate: Number(e.target.value) }),
      onYears: (e) => this.setState({ years: Number(e.target.value) }),
      faqs: [
        { q: 'What is EMI?', a: 'EMI stands for Equated Monthly Instalment \u2014 a fixed payment made every month toward a loan until it is fully repaid, covering both principal and interest.' },
        { q: 'How is EMI calculated?', a: 'EMI = P \u00d7 r \u00d7 (1+r)^n / ((1+r)^n \u2212 1), where P is the loan amount, r is the monthly interest rate, and n is the number of instalments.' },
        { q: 'Does a longer tenure reduce EMI?', a: 'Yes, a longer tenure lowers the monthly EMI but increases the total interest paid over the life of the loan.' },
        { q: 'Can I prepay my loan to save interest?', a: 'Yes, prepaying part of the principal reduces the outstanding balance, which lowers the total interest paid over the remaining tenure.' }
      ]
    };
  }
}

</script>
