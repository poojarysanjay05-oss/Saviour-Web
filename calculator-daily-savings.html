<script>

function inr(n) {
  n = Math.round(n || 0);
  const neg = n < 0; n = Math.abs(n);
  const s = n.toString(), last3 = s.slice(-3), rest = s.slice(0, -3);
  const withCommas = rest ? rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3 : last3;
  return (neg ? '-' : '') + '\u20B9' + withCommas;
}
class Component extends DCLogic {
  state = { daily: 100, years: 5, rate: 7 };
  renderVals() {
    const { daily, years, rate } = this.state;
    const monthly = daily * 30.4;
    const r = rate / 12 / 100, n = years * 12;
    const total = r === 0 ? monthly * n : monthly * ((Math.pow(1 + r, n) - 1) / r) * (1 + r);
    const contributed = monthly * n;
    return {
      daily, years, rate,
      dailyFmt: inr(daily),
      onDaily: (e) => this.setState({ daily: Number(e.target.value) }),
      onYears: (e) => this.setState({ years: Number(e.target.value) }),
      onRate: (e) => this.setState({ rate: Number(e.target.value) }),
      totalFmt: inr(total),
      contributedFmt: inr(contributed),
      growthFmt: inr(Math.max(0, total - contributed)),
      faqs: [
        { q: 'Do small daily savings really add up?', a: 'Yes, saving even \u20B9100 a day adds up to over \u20B936,000 a year before interest, and significantly more with compounding over several years.' },
        { q: 'Where should I put daily savings?', a: "A recurring deposit or a high-yield savings account works well for daily savings, since it's low-risk and still earns some interest." },
        { q: 'Is it better to save daily or monthly?', a: 'The frequency matters less than consistency \u2014 what matters most is that the total amount saved each month stays the same regardless of how you split it.' },
        { q: 'How do I stay consistent with daily savings?', a: 'Automate a small daily or weekly transfer so it happens without relying on willpower each day.' }
      ]
    };
  }
}
