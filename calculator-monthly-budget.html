<script>

function inr(n) {
  n = Math.round(n || 0);
  const neg = n < 0; n = Math.abs(n);
  const s = n.toString(), last3 = s.slice(-3), rest = s.slice(0, -3);
  const withCommas = rest ? rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3 : last3;
  return (neg ? '-' : '') + '\u20B9' + withCommas;
}
class Component extends DCLogic {
  state = { income: 60000, rent: 18000, food: 10000, transport: 4000, bills: 6000, other: 3000 };

  renderVals() {
    const s = this.state;
    const totalExpense = s.rent + s.food + s.transport + s.bills + s.other;
    const leftover = s.income - totalExpense;
    const rate = s.income > 0 ? Math.round((leftover / s.income) * 100) : 0;
    const expensePct = s.income > 0 ? Math.min(100, Math.max(0, Math.round((totalExpense / s.income) * 100))) : 0;
    const savingsBarPct = Math.max(0, 100 - expensePct);
    const fields = [
      { key: 'rent', label: 'Rent / Housing' },
      { key: 'food', label: 'Food & Groceries' },
      { key: 'transport', label: 'Transport' },
      { key: 'bills', label: 'Bills & Utilities' },
      { key: 'other', label: 'Other expenses' }
    ].map(f => ({ label: f.label, value: s[f.key], onInput: (e) => this.setState({ [f.key]: Number(e.target.value) }) }));
    return {
      income: s.income,
      onIncome: (e) => this.setState({ income: Number(e.target.value) }),
      expenseFields: fields,
      leftoverLabel: leftover >= 0 ? 'You can save' : 'You are over budget by',
      leftoverFmt: inr(Math.abs(leftover)),
      leftoverColor: leftover >= 0 ? '#fff' : '#FF6B6B',
      savingsRatePct: rate,
      expensePct, savingsBarPct,
      faqs: [
        { q: 'What is a monthly budget?', a: 'A monthly budget is a plan that matches your income against your expenses so you know exactly how much you can spend, save, or invest each month.' },
        { q: 'How much of my income should I save?', a: 'A common guideline is to save at least 20% of your take-home income, though the right number depends on your goals and expenses.' },
        { q: 'What if my expenses exceed my income?', a: 'If expenses exceed income, look for reducible categories first \u2014 subscriptions, dining out, and discretionary spending \u2014 before cutting fixed costs.' },
        { q: 'How often should I update my budget?', a: 'Review your budget every month, and revisit it fully whenever your income or a major expense changes.' }
      ]
    };
  }
}

</script>
