<script>

function inr(n) {
  n = Math.round(n || 0);
  const neg = n < 0; n = Math.abs(n);
  const s = n.toString(), last3 = s.slice(-3), rest = s.slice(0, -3);
  const withCommas = rest ? rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3 : last3;
  return (neg ? '-' : '') + '\u20B9' + withCommas;
}
function newRegimeTax(taxable) {
  if (taxable <= 700000) return 0;
  const slabs = [[300000,0],[300000,0.05],[300000,0.10],[300000,0.15],[300000,0.20],[Infinity,0.30]];
  let remaining = taxable, tax = 0;
  for (const [size, rate] of slabs) {
    const amt = Math.min(remaining, size);
    tax += amt * rate;
    remaining -= amt;
    if (remaining <= 0) break;
  }
  return tax * 1.04;
}
class Component extends DCLogic {
  state = { ctc: 1200000 };

  renderVals() {
    const ctc = this.state.ctc;
    const basic = ctc * 0.4;
    const hra = basic * 0.5;
    const pf = Math.min(basic, 180000) * 0.12;
    const special = Math.max(0, ctc - basic - hra - pf);
    const gross = ctc - pf;
    const taxable = Math.max(0, gross - 50000);
    const tax = newRegimeTax(taxable);
    const annualTakeHome = ctc - pf - tax;
    const monthly = annualTakeHome / 12;
    return {
      ctc,
      onCtc: (e) => this.setState({ ctc: Number(e.target.value) }),
      monthlyFmt: inr(monthly),
      annualFmt: inr(annualTakeHome),
      basicFmt: inr(basic), hraFmt: inr(hra), specialFmt: inr(special), pfFmt: inr(pf), taxFmt: inr(tax),
      faqs: [
        { q: 'What is CTC?', a: 'CTC (Cost to Company) is the total amount a company spends on an employee annually, including base salary, allowances, and employer PF contributions.' },
        { q: 'Why is take-home salary lower than CTC?', a: 'Take-home salary is lower than CTC because it excludes employer PF contributions and subtracts employee PF and income tax deductions.' },
        { q: 'Which tax regime does this calculator use?', a: "This calculator estimates tax using India's new tax regime slabs with the standard deduction, which is the default option for most salaried employees." },
        { q: 'Is this an exact figure?', a: "This is an estimate for planning purposes \u2014 your exact in-hand salary may vary based on your employer's specific allowance structure and any additional deductions." }
      ]
    };
  }
}
