                  chunks.push(value);
                  totalLen += value.length;

                let offset = 0;
                for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

                console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');

          } catch (err) {
            console.error('Failed to decode asset ' + uuid + ':', err);
            blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));

        const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
        const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
        const resourceMap = {};
        for (const entry of extResources) {
          if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
        }

        setStatus('Rendering...');
        for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

        // Strip integrity + crossorigin — blob URLs from a file:// document inherit
        // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
        // The manifest bytes are ours; SRI protects against CDN compromise, not this.
        template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

        const resourceScript = '<script>window.__resources = ' +
          JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
          ';</' + 'script>';
        // Inject after <head> so the DOCTYPE stays first; prepending the script
        // would push the parser into quirks mode. DOMParser always emits a <head>
        // (synthesizing one if the source HTML omitted it) but may carry
        // attributes through, so match the full opening tag. slice() rather than
        // replace() keeps us clear of $-pattern substitution in resourceScript.
        const headOpen = template.match(/<head[^>]*>/i);
        if (headOpen) {
          const i = headOpen.index + headOpen[0].length;
          template = template.slice(0, i) + resourceScript + template.slice(i);
        }

        // Parse the template and swap the root element. Scripts inserted via
        // DOMParser/replaceWith are inert per spec — re-create each with
        // createElement so they execute, awaiting onload for src scripts to
        // preserve ordering (React before ReactDOM before Babel before text/babel).
        const doc = new DOMParser().parseFromString(template, 'text/html');
        document.documentElement.replaceWith(doc.documentElement);
        const dead = Array.from(document.scripts);
        for (const old of dead) {
          const s = document.createElement('script');
          for (const a of old.attributes) s.setAttribute(a.name, a.value);
          s.textContent = old.textContent;
          // text/babel scripts with a src: fetch and inline. transformScriptTags
          // does XHR against the src, but blob:null/ from a file:// origin is
          // silently dropped. Inlining makes it a plain inline babel script,
          // which transformScriptTags handles unconditionally.
          if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
            const r = await fetch(s.src);
            s.textContent = await r.text();
            s.removeAttribute('src');
          }
          const p = s.src ? new Promise(function (r) { s.onload = s.onerror = r; }) : null;
          old.replaceWith(s);
          if (p) await p;
        }
        // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
        // which fired before we swapped the document. Trigger manually if present.
        if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
          window.Babel.transformScriptTags();
        }
      } catch (err) {
        setStatus('Error unpacking: ' + err.message);
        console.error('Bundle unpack error:', err);
      }
    });

 chartRef = React.createRef();\n  state = { chatInput: '', chatMsgs: [], chatTyping: false, chartIn: false, f3In: false, f4In: false, f5In: false, f6In: false, f3count: 0 };\n\n  componentDidMount() {\n    this._timers = [];\n    this._reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);\n    this._observe(this.chatRef, () => this.startChat());\n    this._observe(this.chartRef, () => this.setState({ chartIn: true }));\n    this._observeSel('[data-screen-label=\"Feature 3 - Savings coach\"]', () => { this.setState({ f3In: true }); this._countUp(); });\n    this._observeSel('[data-screen-label=\"Feature 4 - Built for India\"]', () => this.setState({ f4In: true }));\n    this._observeSel('[data-screen-label=\"Feature 5 - Automatic detection\"]', () => this.setState({ f5In: true }));\n    this._observeSel('[data-screen-label=\"Feature 6 - Edit receipt\"]', () => this.setState({ f6In: true }));\n  }\n\n  componentWillUnmount() {\n    this._cancelled = true;\n    if (this._raf) cancelAnimationFrame(this._raf);\n    (this._timers || []).forEach(t => clearTimeout(t));\n  }\n\n  _observe(ref, cb) {\n    const el = ref && ref.current;\n    if (!el || typeof IntersectionObserver === 'undefined') { cb(); return; }\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach(en => { if (en.isIntersecting) { cb(); io.disconnect(); } });\n    }, { threshold: 0.4 });\n    io.observe(el);\n  }\n\n  _observeSel(sel, cb) {\n    const el = document.querySelector(sel);\n    if (!el || typeof IntersectionObserver === 'undefined') { cb(); return; }\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach(en => { if (en.isIntersecting) { cb(); io.disconnect(); } });\n    }, { threshold: 0.2 });\n    io.observe(el);\n  }\n\n  _countUp() {\n    if (this._counted) return;\n    this._counted = true;\n    if (this._reduce) { this.setState({ f3count: 885 }); return; }\n    const dur = 1100, start = performance.now();\n    const tick = (now) => {\n      if (this._cancelled) return;\n      const p = Math.min(1, (now - start) / dur);\n      const e = 1 - Math.pow(1 - p, 3);\n      this.setState({ f3count: Math.round(885 * e) });\n      if (p < 1) this._raf = requestAnimationFrame(tick);\n    };\n    this._raf = requestAnimationFrame(tick);\n  }\n\n  sleep(ms) {\n    return new Promise(res => { const t = setTimeout(res, ms); (this._timers = this._timers || []).push(t); });\n  }\n\n  async startChat() {\n    if (this._chatStarted) return;\n    this._chatStarted = true;\n    const exchanges = [\n      { text: 'auto 80', card: { icon: '\\u{1F697}', title: 'Auto 80', sub: 'Transport', amount: '\\u20B980' } },\n      { text: 'spent 700 on chai nasta', card: { icon: '\\u{1F354}', title: 'Spent 700 On Chai Nasta', sub: 'Food \\u00B7 Snacks', amount: '\\u20B9700' } }\n    ];\n    if (this._reduce) {\n      const msgs = [];\n      exchanges.forEach((e, i) => {\n        msgs.push({ kind: 'user', key: 'u' + i, text: e.text });\n        msgs.push(Object.assign({ kind: 'logged', key: 'l' + i }, e.card));\n      });\n      this.setState({ chatMsgs: msgs });\n      return;\n    }\n    await this.sleep(450);\n    for (let i = 0; i < exchanges.length; i++) {\n      if (this._cancelled) return;\n      const ex = exchanges[i];\n      for (let c = 1; c <= ex.text.length; c++) {\n        if (this._cancelled) return;\n        this.setState({ chatInput: ex.text.slice(0, c) });\n        await this.sleep(48);\n      }\n      await this.sleep(360);\n      if (this._cancelled) return;\n      this.setState(s => ({ chatMsgs: s.chatMsgs.concat([{ kind: 'user', key: 'u' + i, text: ex.text }]), chatInput: '' }));\n      await this.sleep(430);\n      if (this._cancelled) return;\n      this.setState({ chatTyping: true });\n      await this.sleep(950);\n      if (this._cancelled) return;\n      this.setState(s => ({ chatTyping: false, chatMsgs: s.chatMsgs.concat([Object.assign({ kind: 'logged', key: 'l' + i }, ex.card)]) }));\n      await this.sleep(850);\n    }\n  }\n\n  _chatBody() {\n    const e = React.createElement;\n    const nodes = this.state.chatMsgs.map(m => {\n      if (m.kind === 'user') {\n        return e('div', { key: m.key, style: { alignSelf: 'flex-end', background: '#E6C763', color: '#0D0D0F', fontWeight: 600, fontSize: '13.5px', padding: '8px 14px', borderRadius: '16px 16px 4px 16px', animation: 'msgIn .4s cubic-bezier(.16,1,.3,1) both' } }, m.text);\n      }\n      return e('div', { key: m.key, style: { alignSelf: 'flex-start', width: '90%', background: '#161618', border: '1px solid rgba(255,255,255,0.06)', borderRadius: '16px 16px 16px 4px', padding: '10px 12px', display: 'flex', alignItems: 'center', gap: '10px', animation: 'msgIn .45s cubic-bezier(.16,1,.3,1) both' } },\n        e('span', { style: { fontSize: '19px', flex: 'none' } }, m.icon),\n        e('div', { style: { flex: 1 } },\n          e('div', { style: { fontSize: '13px', fontWeight: 600 } }, m.title),\n          e('div', { style: { fontSize: '10.5px', color: '#8E8E93' } }, m.sub)\n        ),\n        e('div', { style: { textAlign: 'right' } },\n          e('div', { style: { fontSize: '13px', fontWeight: 700, color: '#E6C763' } }, m.amount),\n          e('div', { style: { fontSize: '9.5px', color: '#5FCB8C', fontWeight: 600 } }, '\\u2713 Logged')\n        )\n      );\n    });\n    if (this.state.chatTyping) {\n      const dot = (d) => e('span', { key: 'dot' + d, style: { width: '6px', height: '6px', borderRadius: '50%', background: '#8E8E93', display: 'inline-block', animation: 'typingDot 1.1s ' + d + 's infinite' } });\n      nodes.push(e('div', { key: 'typing', style: { alignSelf: 'flex-start', background: '#161618', border: '1px solid rgba(255,255,255,0.06)', borderRadius: '16px 16px 16px 4px', padding: '12px 14px', display: 'flex', gap: '4px', animation: 'msgIn .3s ease both' } }, dot(0), dot(0.18), dot(0.36)));\n    }\n    return e('div', { style: { display: 'flex', flexDirection: 'column', gap: '10px' } }, nodes);\n  }\n\n  _chatInputNode() {\n    const e = React.createElement;\n    if (!this.state.chatInput) {\n      return e('span', { style: { color: '#8E8E93' } }, 'Type or speak\\u2026');\n    }\n    return e('span', { style: { color: '#fff', fontWeight: 500 } }, this.state.chatInput,\n      e('span', { style: { display: 'inline-block', width: '2px', height: '15px', background: '#E6C763', marginLeft: '2px', verticalAlign: '-3px', animation: 'blink 1s step-end infinite' } }));\n  }\n\n  renderVals() {\n    // May 2026 starts on a Friday -> 5 leading blanks (Sun..Thu)\n    const levels = [1,0,0,2,0,0,2,4,4,3,2,3,0,2,1,1,0,3,3,3,0,0,0,3,3,3,0,0,1,5,0];\n    const colors = ['#1C1C1E','rgba(230,199,99,0.16)','rgba(230,199,99,0.32)','rgba(230,199,99,0.52)','rgba(230,199,99,0.8)','#E6C763'];\n    const cells = [];\n    let cidx = 0;\n    for (let b = 0; b < 5; b++) cells.push({ key: 'b' + b, day: '', bg: 'transparent', fg: 'transparent', delay: (cidx++ * 0.016).toFixed(3) + 's' });\n    for (let d = 1; d <= 31; d++) {\n      const lv = levels[d - 1] || 0;\n      cells.push({\n        key: 'd' + d,\n        day: String(d),\n        bg: colors[lv],\n        fg: lv >= 4 ? '#0D0D0F' : (lv === 0 ? '#6A6A70' : '#D4D4D9'),\n        delay: (cidx++ * 0.016).toFixed(3) + 's'\n      });\n    }\n    const ci = this.state.chartIn || this._reduce;\n    const f3 = this.state.f3In || this._reduce;\n    const f4 = this.state.f4In || this._reduce;\n    const f5 = this.state.f5In || this._reduce;\n    const f6 = this.state.f6In || this._reduce;\n    return {\n      calCells: cells,\n      chatRef: this.chatRef,\n      chartRef: this.chartRef,\n      chatBody: this._chatBody(),\n      chatInputNode: this._chatInputNode(),\n      bar1h: ci ? '66%' : '0%',\n      bar2h: ci ? '52%' : '0%',\n      bar3h: ci ? '33%' : '0%',\n      f3o: f3 ? 1 : 0,\n      f3t: f3 ? 'none' : 'translateY(12px)',\n      f3count: this.state.f3count,\n      f4o: f4 ? 1 : 0,\n      f4t: f4 ? 'none' : 'translateY(12px)',\n      f4cellT: f4 ? 'none' : 'scale(0.4)',\n      f5o: f5 ? 1 : 0,\n      f5t: f5 ? 'none' : 'translateY(14px)',\n      rcpY: f6 ? '0%' : '-100%',\n      f6o: f6 ? 1 : 0,\n      f6t: f6 ? 'none' : 'translateY(10px)'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
