<script>

function inr(n) {
  n = Math.round(n || 0);
  const neg = n < 0; n = Math.abs(n);
  const s = n.toString(), last3 = s.slice(-3), rest = s.slice(0, -3);
  const withCommas = rest ? rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3 : last3;
  return (neg ? '-' : '') + '\u20B9' + withCommas;
}
function newRegimeTax(taxable) {
  if (taxable <= 700000) return 0;
  const slabs = [[300000,0],[300000,0.05],[300000,0.10],[300000,0.15],[300000,0.20],[Infinity,0.30]];
  let remaining = taxable, tax = 0;
  for (const [size, r] of slabs) { const amt = Math.min(remaining, size); tax += amt * r; remaining -= amt; if (remaining <= 0) break; }
  return tax * 1.04;
}
class Component extends DCLogic {
  state = { ctc: 1000000 };
  renderVals() {
    const ctc = this.state.ctc;
    const basic = ctc * 0.4;
    const hra = basic * 0.5;
    const pf = Math.min(basic, 180000) * 0.12;
    const taxable = Math.max(0, ctc - pf - 50000);
    const tax = newRegimeTax(taxable);
    const special = Math.max(0, ctc - basic - hra - pf - tax);
    const items = [
      { label: 'Basic Salary', value: basic, color: '#E6C763' },
      { label: 'HRA', value: hra, color: '#F6CDA6' },
      { label: 'Special Allowance', value: special, color: '#F4B8D6' },
      { label: 'Employer PF', value: pf, color: '#7C9CF2' },
      { label: 'Estimated Tax', value: tax, color: '#3A3A3D' }
    ].map(it => ({ label: it.label, valueFmt: inr(it.value), color: it.color, pct: Math.max(2, Math.round((it.value / ctc) * 100)) }));
    return {
      ctc, onCtc: (e) => this.setState({ ctc: Number(e.target.value) }),
      items,
      faqs: [
        { q: 'What are the main components of CTC?', a: 'CTC typically includes basic salary, HRA, special allowances, employer PF contribution, and other benefits like bonuses or insurance.' },
        { q: 'Why is basic salary usually 40-50% of CTC?', a: 'Companies structure basic salary around 40-50% of CTC because many other components like HRA and PF are calculated as a percentage of basic pay.' },
        { q: 'What is HRA?', a: 'HRA (House Rent Allowance) is a component of salary meant to cover rental housing costs, and is partially or fully tax-exempt if you live in rented accommodation.' },
        { q: 'Is this breakdown the same for every company?', a: 'No, exact percentages vary by employer. This tool uses common industry averages for estimation purposes.' }
      ]
    };
  }
}
