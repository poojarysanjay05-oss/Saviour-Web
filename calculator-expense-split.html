<script>

function inr(n) {
  n = Math.round(n || 0);
  const neg = n < 0; n = Math.abs(n);
  const s = n.toString(), last3 = s.slice(-3), rest = s.slice(0, -3);
  const withCommas = rest ? rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3 : last3;
  return (neg ? '-' : '') + '\u20B9' + withCommas;
}
class Component extends DCLogic {
  state = { bill: 4000, people: 4, tip: 10 };
  renderVals() {
    const { bill, people, tip } = this.state;
    const totalWithTip = bill * (1 + tip / 100);
    const perPerson = totalWithTip / people;
    return {
      bill, people, tip,
      onBill: (e) => this.setState({ bill: Number(e.target.value) }),
      onPeople: (e) => this.setState({ people: Number(e.target.value) }),
      onTip: (e) => this.setState({ tip: Number(e.target.value) }),
      perPersonFmt: inr(perPerson),
      totalWithTipFmt: inr(totalWithTip),
      faqs: [
        { q: 'How do I split a bill evenly?', a: 'Divide the total bill amount, including any tip, by the number of people to get an equal share per person.' },
        { q: 'Should tip be included before or after splitting?', a: 'Add the tip to the total bill first, then divide by the number of people, so everyone contributes a proportional share of the tip too.' },
        { q: 'What if people ordered different amounts?', a: 'For itemized splitting where people ordered different amounts, each person should pay for their own items plus an equal share of shared items and tax.' },
        { q: 'What is a fair tip percentage?', a: 'A tip of 10% is common for standard service, while 15-20% is typical for good service at sit-down restaurants.' }
      ]
    };
  }
}
